repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]

      - id: check-case-conflict

      - id: check-merge-conflict

      - id: check-symlinks

      - id: check-yaml
        args: ["--allow-multiple-documents"]

      - id: end-of-file-fixer

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      - id: check-shebang-scripts-are-executable

      - id: no-commit-to-branch
        args: [--branch, main]

      - id: mixed-line-ending
        args: [--fix=lf]

      - id: forbid-new-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347 # frozen: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
        args:
          - --config
          - commitlint.config.js

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--external-sources]

  # Local, not a pinned third-party repo - these are house rules/tooling
  # specific to this repo (check-tf-standards.sh, tflint.sh, checkov.sh are
  # all adapted from jay-withers/template-repo-terraform-root's own
  # .pre-commit-config.yaml - see each script's header for what changed and
  # why). tflint/checkov replace antonbabenko/pre-commit-terraform's own
  # terraform_tflint/terraform_checkov hooks entirely, same as that repo,
  # so linting runs with terraform.tfvars applied - var.repos/var.state_consumers
  # have no defaults, so an unresolved plan is far less useful to lint.
  - repo: local
    hooks:
      - id: check-tf-standards
        name: Check Terraform file layout standards
        description: "Fails if a locals/variable/output/data block isn't in a matching locals*.tf/variables*.tf/outputs*.tf/data*.tf file, or a terraform{}/provider{} block isn't in versions.tf."
        entry: scripts/check-tf-standards.sh
        language: script
        pass_filenames: false
        files: \.tf$

      - id: tflint
        name: TFLint
        description: Runs tflint against terraform/ with terraform.tfvars applied.
        entry: scripts/tflint.sh
        language: script
        pass_filenames: false
        files: \.(tf|tfvars)$
        exclude: \.terraform/.*$

      - id: checkov
        name: Checkov
        description: Runs checkov against terraform/ with terraform.tfvars applied.
        entry: scripts/checkov.sh
        language: script
        pass_filenames: false
        files: \.(tf|tfvars)$
        exclude: \.terraform/.*$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 581213484f4262600d17c71e272176d4eb6724a5 # frozen: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
