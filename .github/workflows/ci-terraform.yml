name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init + validate of terraform/, via the shared workflow.
  # The path filter and the always-reporting gate job both live in there — mark
  # "terraform / Terraform" as the required check in the ruleset, not the bare
  # job id, the same way ci-lint reports as "pre-commit / Pre-commit".
  #
  # There is no plan job. This configuration needs both a GitHub PAT with admin
  # rights on every repo in var.repos and Azure credentials for its backend, and
  # its backend.tf points at the shared state account — the shared workflow
  # inits with -backend=false so none of that is needed to validate.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@194b4d83c5cb19350f203bda16f5d95d4c6090da # v1.14.3
