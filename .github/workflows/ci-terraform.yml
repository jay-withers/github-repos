name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init + validate of terraform/, via the shared workflow.
  # The path filter and the always-reporting gate job both live in there — mark
  # "terraform / Terraform" as the required check in the ruleset, not the bare
  # job id, the same way ci-lint reports as "pre-commit / Pre-commit".
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@e58b7edf840e0d24387064427d7c7e81338c6d40 # v1.20.0

  # No credentialled plan on pull requests, deliberately. The only identity
  # and token that can read everything this configuration touches are the
  # apply ones, and those live in the main-only `apply` environment, so branch
  # code never holds them. The real plan runs on merge (cd-terraform), lands in
  # the terraform-pending issue, and is read there before Run workflow.
  #
  # `terraform-plan` stays as a context because the ruleset requires it, the
  # same name the other Terraform repos report. Here it gates the validate.
  terraform-plan:
    needs: terraform
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the validate job
        env:
          RESULT: ${{ needs.terraform.result }}
        run: |
          echo "terraform=$RESULT"
          if [ "$RESULT" = "failure" ]; then
            echo "::error::Terraform validate failed."
            exit 1
          fi
