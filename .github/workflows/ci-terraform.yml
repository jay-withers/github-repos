name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Path filtering lives here (not the workflow trigger) so the workflow
  # always runs and the required check below always reports - a workflow
  # skipped by a top-level paths filter would leave a required check pending
  # forever and block the merge.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Detect Terraform changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.terraform-version'
              - '.github/workflows/ci-terraform.yml'

  # Gated on vars.AZURE_CLIENT_ID in addition to the path filter: this module
  # now also manages Azure resources (state.tf/identities.tf, for the shared
  # Terraform state storage account - see terraform/README.md), and its
  # backend.tf points at that same account. `terraform init` initializes the
  # whole configuration, backend included, so there is no way to plan just
  # the GitHub-only resources without Azure credentials once a real backend
  # is configured - same reasoning, and the same gate, as
  # terraform-root-aks's ci-terraform.yml. Set AZURE_CLIENT_ID/TENANT_ID/
  # SUBSCRIPTION_ID once scripts/bootstrap-state.ps1 has been run and this
  # repo's own identity (state_github_secrets output) exists.
  plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      # A PAT with admin rights on every repo in var.repos - see
      # terraform/README.md. Not the built-in GITHUB_TOKEN: that's scoped to
      # this one repo and can't read or plan changes against the others.
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve Terraform version
        id: tfversion
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  # Single required status check for branch protection. Always runs, and
  # fails only if plan actually failed - skipped (no Terraform changes)
  # counts as success, so non-Terraform PRs are not blocked. Mark this check
  # ("ci-terraform") required in the ruleset.
  ci-terraform:
    needs: [plan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Terraform jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "plan=$PLAN_RESULT"
          if [ "$PLAN_RESULT" = "failure" ]; then
            echo "::error::A Terraform job failed."
            exit 1
          fi
